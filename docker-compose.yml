services:
  dashboard:
    build: .
    image: ghcr.io/nexmoe/metribee:latest
    env_file: .env
    environment:
      # .env sets HOST=127.0.0.1 for bare-metal. Inside the container that hides
      # the server from the published port, so listen on all interfaces here.
      HOST: 0.0.0.0
    ports:
      # Localhost only. The app has no login: put a reverse proxy or tunnel in front of it.
      - "127.0.0.1:5485:5483"
    volumes:
      # Host directories so a local restart keeps funnels, quota, favicons, and report cache.
      - ./.data:/app/.data
      - ./.cache:/app/.cache
    restart: unless-stopped
